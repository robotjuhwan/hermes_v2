[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradecraft-ui"
version = "0.1.0"
description = "Responsive trading UI with Telegram bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "pypdf>=5.0.0",
  "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[project.scripts]
tradecraft-ui = "tradecraft.main:run"
tradecraft-control = "tradecraft.main:run"
tradecraft-runtime = "tradecraft.runtime.runner:run"
tradecraft-intelligence = "tradecraft.runtime.intelligence_runner:run"
tradecraft-strategy-insights = "tradecraft.runtime.strategy_insights_runner:run"
tradecraft-market-judge = "tradecraft.runtime.market_judge_runner:run"
tradecraft-investment-memory = "tradecraft.runtime.investment_memory_runner:run"
tradecraft-research = "tradecraft.runtime.research_runner:run"
tradecraft-kis-trader = "tradecraft.runtime.kis_trader_runner:run"
tradecraft-kis-block-trader = "tradecraft.runtime.kis_block_trader_runner:run"
tradecraft-naver-reports = "tradecraft.runtime.naver_reports_runner:run"
tradecraft-reports-api = "tradecraft.reports_api.main:run"
tradecraft-reports-worker = "tradecraft.reports_api.worker:run"
tradecraft-reports-stack = "tradecraft.reports_api.stack:run"
