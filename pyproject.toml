[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradecraft-ui"
version = "0.1.0"
description = "Responsive trading UI with Telegram bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "psutil>=5.9.0",
  "pypdf>=5.0.0",
  "chromadb>=0.5.0",
]

[project.optional-dependencies]
codex-sdk = [
  "openai-codex>=0.1.0b2",
]
dev = [
  "pytest>=8.2.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradecraft = [
  "jue/skills/*.md",
  "jue/workflows/*.json",
  "jue/contracts/*.json",
  "jue/sources/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "unit: isolated deterministic behavior tests",
  "contract: API, payload, configuration, and compatibility contract tests",
  "integration: multi-component or external-adapter integration tests",
  "slow: large or intentionally long-running regression tests",
  "binance: Binance domain tests",
  "kis: KIS domain tests",
  "jue: Jue and Jue Wiki domain tests",
  "readiness: operational readiness and status tests",
  "memory: investment memory and performance learning tests",
  "runtime: runner, watchdog, and runtime orchestration tests",
  "reports: reports, research, and RAG tests",
  "crypto: shared crypto, Binance, and Upbit tests",
]

[project.scripts]
tradecraft-ui = "tradecraft.main:run"
tradecraft-control = "tradecraft.main:run"
tradecraft-runtime = "tradecraft.runtime.runner:run"
tradecraft-runtime-archive = "tradecraft.runtime.runtime_archive_cli:run"
tradecraft-intelligence = "tradecraft.runtime.intelligence_runner:run"
tradecraft-strategy-insights = "tradecraft.runtime.strategy_insights_runner:run"
tradecraft-market-judge = "tradecraft.runtime.market_judge_runner:run"
tradecraft-market-pulse = "tradecraft.runtime.market_pulse_runner:run"
tradecraft-jue-wiki = "tradecraft.runtime.jue_wiki_runner:run"
tradecraft-investment-memory = "tradecraft.runtime.investment_memory_runner:run"
tradecraft-live-evaluator = "tradecraft.runtime.live_evaluator_runner:run"
tradecraft-watchdog = "tradecraft.runtime.watchdog_runner:run"
tradecraft-crypto-market-research = "tradecraft.runtime.crypto_market_research_runner:run"
tradecraft-crypto-pattern-lab = "tradecraft.runtime.crypto_pattern_lab_runner:run"
tradecraft-crypto-alpha = "tradecraft.runtime.crypto_alpha_runner:run"
tradecraft-research = "tradecraft.runtime.research_runner:run"
tradecraft-kis-block-trader = "tradecraft.runtime.kis_block_trader_runner:run"
tradecraft-binance-block-trader = "tradecraft.runtime.binance_block_trader_runner:run"
tradecraft-naver-reports = "tradecraft.runtime.naver_reports_runner:run"
tradecraft-reports-api = "tradecraft.reports_api.main:run"
tradecraft-reports-worker = "tradecraft.reports_api.worker:run"
tradecraft-reports-stack = "tradecraft.reports_api.stack:run"
